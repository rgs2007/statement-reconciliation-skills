name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The skill must work on an older interpreter (restricted corporate
        # environments) and on the newest pandas, where `.astype(str)`
        # preserves NaN — a real source of breakage this suite guards.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tool adapters must match the canonical SKILL.md
        # AGENTS.md, CLAUDE.md, the Copilot files and the Cursor rule are all
        # generated from statement-reconciliation/SKILL.md. Drifted guidance is
        # worse than none — it looks authoritative while being wrong.
        run: python tools/sync_adapters.py --check

      - name: Golden-file regression tests
        run: python tests/run_tests.py

      - name: Skill self-test
        run: python statement-reconciliation/scripts/selftest.py

      - name: Pytest suite
        run: pytest tests/ -v

      - name: Text fixtures must be reproducible from the generator
        # Regenerating the sources must not change them. If this fails, either
        # a fixture was hand-edited or the generator drifted — both hide what
        # the committed test data actually is.
        #
        # Generated .xlsx files are excluded on purpose: openpyxl stamps its
        # own version into docProps/app.xml, so the bytes differ on any machine
        # with a different openpyxl. Asserting byte-identity there would fail
        # on library upgrades rather than on real drift. Their *content* is
        # still checked — the golden profile compares structure, and a separate
        # test asserts the committed workbook actually opens.
        run: |
          python tests/make_fixtures.py
          if ! git diff --exit-code -- tests/fixtures ':(exclude)*.xlsx' ':(exclude)*.xlsm'; then
            echo "::error::Regenerating fixtures changed the committed text sources."
            echo "Run 'python tests/make_fixtures.py' locally and commit, or fix the generator."
            exit 1
          fi
